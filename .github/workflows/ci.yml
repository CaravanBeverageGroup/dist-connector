name: ci

on:
  push:
  pull_request:

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Проверка публичной безопасности
        run: bash ./scripts/check_public_safe.sh
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Сборка и публикация образа в ghcr.io (:vX.Y.Z / :canary) добавляются вместе с кодом коннектора.
