name: ci

on:
  push:
  pull_request:

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Проверка публичной безопасности
        run: bash ./scripts/check_public_safe.sh
      - name: gitleaks
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --verbose
  # Сборка и публикация образа в ghcr.io (:vX.Y.Z / :canary) добавляются вместе с кодом коннектора.
